on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner to run dedicated workloads'
        required: false
        type: string
        default: ubuntu-latest
jobs:
  gate:
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      MODE: ${{ steps.mock.outputs.MODE }}
      APPROVAL: ${{ steps.mock.outputs.APPROVAL }}
    steps:
      - name: Mock
        id: mock
        run: |
          set -euo pipefail
          echo "APPROVAL=true" >> "$GITHUB_OUTPUT"
          echo "MODE=verify"   >> "$GITHUB_OUTPUT"
  approval:
    needs: [gate]
    if: >-
      ${{ !cancelled()
          && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
          && needs.gate.result == 'success'
          && needs.gate.outputs.MODE == 'verify' && needs.gate.outputs.APPROVAL == 'true' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      pull-requests: read
    timeout-minutes: 20
    outputs:
      approved: ${{ steps.decide.outputs.approved }}
    steps:
      - name: Decide
        id: decide
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const { repository } = await github.graphql(`
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    state
                    isDraft
                    headRefOid
                    reviewDecision
                  }
                }
              }
            `, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              number: context.payload.pull_request.number
            });

            const pr = repository.pullRequest;
            core.info(JSON.stringify(pr, null, 2));

            const approved =
              pr.state === "OPEN" &&
              !pr.isDraft &&
              pr.headRefOid === process.env.TARGET_SHA &&
              pr.reviewDecision === "APPROVED";

            core.setOutput("approved", String(approved));
            if (!approved) {
              core.notice("Build blocked: the current, non-draft PR must satisfy required reviews.");
            }

  build:
    needs: [gate, approval]
    name: ${{ matrix.app.platform }} (${{ matrix.app.arch }})
    if: >-
      ${{ !cancelled() && needs.gate.result == 'success'
          && (github.event_name == 'push'
              || ((github.event_name == 'pull_request' || github.event_name == 'pull_request_review')
                  && (needs.gate.outputs.MODE != 'verify' || needs.gate.outputs.APPROVAL != 'true'
                      || (needs.approval.result == 'success' && needs.approval.outputs.approved == 'true')))) }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app:
          - platform: macos
            arch: arm64
          - platform: macos
            arch: amd64
    steps:
      - name: Git LFS
        run: |
          echo "Done"

  pr-checks:
    needs: [gate, approval, build]
    name: pr-checks
    if: ${{ always() && (github.event_name == 'pull_request' || github.event_name == 'pull_request_review') }}
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    steps:
      - name: Gate on upstream results
        env:
          GATE_RESULT: ${{ needs.gate.result }}
          MODE: ${{ needs.gate.outputs.MODE }}
          APPROVAL_REQUIRED: ${{ needs.gate.outputs.APPROVAL }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
          APPROVED: ${{ needs.approval.outputs.approved }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          echo "gate=$GATE_RESULT approval=$APPROVAL_RESULT approved=$APPROVED build=$BUILD_RESULT"
          if [[ "$GATE_RESULT" != "success" ]]; then
            echo "::error::The gate did not pass (result=$GATE_RESULT)."
            exit 1
          fi
          if [[ "$MODE" == "verify" && "$APPROVAL_REQUIRED" == "true" ]]; then
            if [[ "$APPROVAL_RESULT" != "success" || "$APPROVED" != "true" ]]; then
              echo "::error::The current PR has not satisfied required reviews."
              exit 1
            fi
          fi
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::The build did not pass (result=$BUILD_RESULT)."
            exit 1
          fi
          echo "Approval policy and all matrix cells passed."
