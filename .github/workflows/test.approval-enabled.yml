name: Test
run-name: "Test CI/CD · ${{ github.event_name }} · ${{ github.ref_name }}"

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, edited]
    branches:
      - main
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    if: github.event_name == 'push' || github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      runner: ubuntu-latest
